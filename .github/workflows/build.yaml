name: Build and check fonts
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install gftools fontbakery[googlefonts]
      - name: Build fonts
        run: |
          mkdir -p out
          gftools builder sources/config.yaml
      - name: Fontbakery (Google Fonts profile)
        run: |
          mkdir -p out/fontbakery
          fontbakery check-googlefonts -l WARN --succinct \
            --html out/fontbakery/report.html \
            --ghmarkdown out/fontbakery/report.md \
            fonts/variable/*.ttf || true
          cat out/fontbakery/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: odra-sans-fonts
          path: |
            fonts
            out/fontbakery
