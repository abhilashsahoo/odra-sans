name: Build and check fonts
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install gftools
          python -m venv /tmp/fb
          /tmp/fb/bin/pip install --upgrade pip
          /tmp/fb/bin/pip install "fontbakery[googlefonts]==1.1.0"
      - name: Build fonts
        run: |
          mkdir -p out
          gftools builder sources/config.yaml
      - name: Fontbakery (Google Fonts profile)
        run: |
          mkdir -p out/fontbakery
          set +e
          /tmp/fb/bin/fontbakery check-googlefonts -l WARN --succinct \
            --html out/fontbakery/report.html \
            --ghmarkdown out/fontbakery/report.md \
            fonts/variable/*.ttf
          rc=$?
          if [ -f out/fontbakery/report.md ]; then cat out/fontbakery/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odra-sans-fonts
          path: |
            fonts
            out/fontbakery
